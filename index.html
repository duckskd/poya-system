<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POYA 商家核銷系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 flex flex-col items-center">

    <div class="w-full max-w-md bg-white p-6 rounded-2xl shadow-lg">
        <h2 class="text-2xl font-bold mb-4 text-center text-gray-800">商家核銷系統</h2>
        <div id="reader" class="rounded-lg overflow-hidden mb-4 border-2 border-gray-200"></div>

        <div class="flex gap-2 mb-4">
            <input type="text" id="qr-input" class="flex-1 border p-2 rounded-lg" placeholder="掃描或輸入 ID">
            <button onclick="searchMember()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">搜尋</button>
        </div>
        
        <p id="status" class="text-center text-sm text-gray-500 mb-4"></p>

        <div id="action-panel" class="hidden border-t pt-4">
            <div class="text-center mb-4">
                <p class="text-gray-600">會員: <span id="res-name" class="font-bold text-lg"></span></p>
                <p class="text-gray-600">目前點數: <span id="res-vouchers" class="font-bold text-2xl text-blue-600">0</span></p>
            </div>
            <div class="flex gap-2">
                <button onclick="updateVouchers(-1)" class="flex-1 bg-red-500 text-white py-2 rounded-lg hover:bg-red-600">扣除 1 點</button>
                <button onclick="updateVouchers(1)" class="flex-1 bg-green-500 text-white py-2 rounded-lg hover:bg-green-600">新增 1 點</button>
            </div>
        </div>
    </div>

    <script>
        const myClient = supabase.createClient(
            'https://eqrbhvvuraqrivbeldil.supabase.co', 
            'sb_publishable_7NHGwJahIgUJhJ4M8_gODg_EnHfvpkg'
        );

        let currentId = "";

        const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 200 });
        html5QrcodeScanner.render((decodedText) => {
            // 智慧解析：如果是網址，取最後一段當作 ID
            const parts = decodedText.split('/');
            const id = parts[parts.length - 1];
            document.getElementById('qr-input').value = id;
            searchMember();
        });

        async function searchMember() {
            const qrId = document.getElementById('qr-input').value.trim();
            const status = document.getElementById('status');
            const panel = document.getElementById('action-panel');
            
            status.innerText = "搜尋中...";
            panel.classList.add('hidden');
            
            const { data, error } = await myClient.from('Users').select('*').eq('external_qr_id', qrId);

            if (error || !data || data.length === 0) {
                status.innerText = "查無此會員";
            } else {
                status.innerText = "搜尋成功！";
                panel.classList.remove('hidden');
                currentId = data[0].external_qr_id;
                document.getElementById("res-name").innerText = data[0].name;
                document.getElementById("res-vouchers").innerText = data[0].vouchers;
            }
        }

        async function updateVouchers(change) {
            const currentVal = parseInt(document.getElementById("res-vouchers").innerText);
            const newVal = currentVal + change;

            const { error: userErr } = await myClient.from('Users').update({ vouchers: newVal }).eq('external_qr_id', currentId);
            
            if (userErr) {
                alert("更新失敗: " + userErr.message);
                return;
            }

            try {
                await myClient.from('UsageLogs').insert([{ user_id: currentId, change_amount: change }]);
            } catch (e) {
                console.warn("紀錄表無法寫入");
            }

            document.getElementById("res-vouchers").innerText = newVal;
            alert("更新成功！");
        }
    </script>
</body>
</html>
